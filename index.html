<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistencia UAEMéx</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
}

/* INICIO */

#inicio{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0b4f2f,#116d42);
}

.inicio-card{
background:white;
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.25);
max-width:450px;
}

.inicio-card h1{
color:#0b4f2f;
margin-bottom:15px;
}

.inicio-card h2{
color:#b8860b;
font-size:40px;
margin-bottom:10px;
}

.inicio-card p{
font-size:22px;
margin-bottom:25px;
}

.inicio-card button{
background:#0b4f2f;
color:white;
border:none;
padding:18px 35px;
font-size:22px;
border-radius:15px;
cursor:pointer;
}

/* SISTEMA */

.header{
background:#0b4f2f;
color:white;
text-align:center;
padding:20px;
}

.header h1{
font-size:30px;
}

.contenedor{
padding:20px;
}

#contador{
text-align:center;
color:#0b4f2f;
font-size:45px;
font-weight:bold;
margin-bottom:10px;
}

.progreso{
width:90%;
max-width:700px;
height:18px;
background:#ddd;
margin:auto;
border-radius:20px;
overflow:hidden;
}

#barra{
height:100%;
width:0%;
background:#0b4f2f;
}

.tarjeta{
background:white;
max-width:800px;
margin:20px auto;
padding:30px;
border-radius:25px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
text-align:center;
}

#lista{
font-size:42px;
font-weight:bold;
color:#b8860b;
}

#nombreAlumno{
margin-top:15px;
font-size:40px;
font-weight:bold;
color:#0b4f2f;
}

.botones{
max-width:800px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.boton{
border:none;
padding:30px;
font-size:28px;
font-weight:bold;
border-radius:20px;
color:white;
cursor:pointer;
}

.presente{
background:#43a047;
}

.ausente{
background:#d32f2f;
}

.anterior{
background:#0b4f2f;
}

.siguiente{
background:#0b4f2f;
}

#descargar{
display:none;
margin:20px auto;
padding:18px 25px;
font-size:20px;
border:none;
background:#f59e0b;
color:white;
border-radius:15px;
cursor:pointer;
}

.descarga{
text-align:center;
}

.footer{
margin-top:20px;
background:#0b4f2f;
color:white;
text-align:center;
padding:15px;
}

</style>
</head>
<body>

<div id="inicio">

<div class="inicio-card">

<h1>📋 Asistencia UAEMéx</h1>

<h2>Salón 318</h2>

<p>Grupo 18</p>

<button onclick="iniciarSistema()">
🚀 Iniciar Pase de Lista
</button>

</div>

</div>

<div id="sistema" style="display:none;">

<div class="header">
<h1>Asistencia UAEMéx</h1>
</div>

<div class="contenedor">

<div id="contador"></div>

<div class="progreso">
<div id="barra"></div>
</div>

<div class="tarjeta">

<div id="lista"></div>

<div id="nombreAlumno"></div>

</div>

<div class="botones">

<button class="boton presente"
onclick="registrar('Presente')">
✅<br>Presente
</button>

<button class="boton ausente"
onclick="registrar('Ausente')">
❌<br>Ausente
</button>

<button class="boton anterior"
onclick="anterior()">
⬅️<br>Anterior
</button>

<button class="boton siguiente"
onclick="siguiente()">
➡️<br>Siguiente
</button>

</div>

<div class="descarga">

<button id="descargar"
onclick="descargarReporte()">
📊 Descargar Reporte
</button>

</div>

</div>

<div class="footer">
Salón 318 - Grupo 18
</div>

</div>

<script>

const alumnos = [
{lista:1,nombre:"AGUILAR ROCHA FABIAN YAIR"},
{lista:2,nombre:"BOBADILLA HERNANDEZ TANIA"},
{lista:3,nombre:"CALVO RAMIREZ YESHUA EMMANUEL"},
{lista:4,nombre:"CAMPOS BERNAL ABRIL AKARI"},
{lista:5,nombre:"CORTES ESCAMILLA ABRAHAM"},
{lista:6,nombre:"COTERO MINISTRO XIMENA VALENTINA"},
{lista:7,nombre:"CRUZ ORTEGA ERICK URIEL"},
{lista:8,nombre:"DAVILA CASTAÑEDA KEVIN"},
{lista:9,nombre:"FERNIZA CORTEZ CARLOS ALBERTO"},
{lista:10,nombre:"GARCIA FERNANDEZ JEREMY ALAIN"},
{lista:11,nombre:"GARCIA RAMIREZ YAZARET MELISSA"},
{lista:12,nombre:"GONZALEZ BETANZOS ENGADI TZITZIKI"},
{lista:13,nombre:"GUADARRAMA SANCHEZ KARIM"},
{lista:14,nombre:"GUARDA HERNANDEZ JEFTE"},
{lista:15,nombre:"JARDON ALBA DARSHAN BAKARI"},
{lista:16,nombre:"JIMENEZ CORTEZ DIEGO JADIEL"},
{lista:17,nombre:"LARA GOMEZ ESTEFANIA"},
{lista:18,nombre:"LOME CHEPE JOSE MIGUEL"},
{lista:19,nombre:"LOPEZ BERNAL AZUL CAMILA"},
{lista:20,nombre:"MANCILLA SALINAS ESTRELLA GUADALUPE"},
{lista:21,nombre:"MARTINEZ CHAVEZ ARIANA ABIGAIL"},
{lista:22,nombre:"MARTINEZ MARTINEZ JOSE ANGEL"},
{lista:23,nombre:"MESAS ORTEGA NARALY"},
{lista:24,nombre:"MILLAN BUSTOS AXEL ALBERTO"},
{lista:25,nombre:"OCAMPO SANCHEZ AXEL JESUS"},
{lista:26,nombre:"ORIHUELA MILLAN JESUS EMMANUEL"},
{lista:27,nombre:"PERALTA LOPEZ LEONARDO"},
{lista:28,nombre:"PERETE NUÑEZ CAMILA ZOE"},
{lista:29,nombre:"QUIROZ RIVERA IVAN ALONSO"},
{lista:30,nombre:"REYES PEÑA YOLEI XIMENA"},
{lista:31,nombre:"RIOJA PIÑA YAHEL ALBERTO"},
{lista:32,nombre:"ROMERO GUTIERREZ ITZEL MARCELA"},
{lista:33,nombre:"ROMERO MENDOZA JUAN"},
{lista:34,nombre:"ROSALES MARTINEZ SEBASTIAN"},
{lista:35,nombre:"SANCHEZ SILVA XIMENA"},
{lista:36,nombre:"VARA GARCIA ZOAR"},
{lista:37,nombre:"VASQUEZ BUSTOS ROXANA ELIZABETH"},
{lista:38,nombre:"VASQUEZ CASTAÑEDA KENIA CAMILA"},
{lista:39,nombre:"VASQUEZ TAPIA SEBASTIAN"}
];

let actual = 0;
let asistencias = {};

function iniciarSistema(){
document.getElementById("inicio").style.display="none";
document.getElementById("sistema").style.display="block";
mostrarAlumno();
}

function mostrarAlumno(){

document.getElementById("lista").textContent =
"Lista " + alumnos[actual].lista;

document.getElementById("nombreAlumno").textContent =
alumnos[actual].nombre;

document.getElementById("contador").textContent =
(alumnos[actual].lista) + " de " + alumnos.length;

let progreso =
((actual + 1) / alumnos.length) * 100;

document.getElementById("barra").style.width =
progreso + "%";

}

function registrar(estado){

asistencias[alumnos[actual].lista] = {
Lista: alumnos[actual].lista,
Alumno: alumnos[actual].nombre,
Asistencia: estado
};

if(actual < alumnos.length - 1){
actual++;
mostrarAlumno();
}else{
document.getElementById("nombreAlumno").textContent =
"✅ LISTA TERMINADA";

document.getElementById("descargar").style.display =
"inline-block";
}
}

function anterior(){
if(actual > 0){
actual--;
mostrarAlumno();
}
}

function siguiente(){
if(actual < alumnos.length - 1){
actual++;
mostrarAlumno();
}
}

function descargarReporte(){

let csv =
"Lista,Alumno,Asistencia\r\n";

Object.values(asistencias).forEach(registro => {

csv +=
registro.Lista + "," +
'"' + registro.Alumno + '"' + "," +
registro.Asistencia + "\r\n";

});

const blob =
new Blob([csv],{
type:"text/csv;charset=utf-8;"
});

const enlace =
document.createElement("a");

enlace.href =
URL.createObjectURL(blob);

enlace.download =
"Reporte_Asistencia_Grupo18.csv";

document.body.appendChild(enlace);

enlace.click();

document.body.removeChild(enlace);

}

</script>

</body>
</html>
